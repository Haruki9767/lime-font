name: Quality

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python for font generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: python -m pip install --disable-pip-version-check fonttools brotli

      - name: Generate WOFF2 font
        run: python scripts/generate_woff2.py

      - name: Check generated WOFF2 is committed
        run: git diff --exit-code -- client/public/lime-fonts.woff2

      - name: Typecheck
        run: pnpm check

      - name: Production build
        run: pnpm build
